<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff4e00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexxaDBC" />

    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexxaDBC" />
    <meta property="og:title" content="NexxaDBC | Digital Business Cards for Professionals & Teams" />
    <meta
      property="og:description"
      content="Create your NexxaDBC digital business card in minutes. Share it instantly by QR code, capture leads, and manage your whole team's cards, no app download or printing needed."
    />
    <meta property="og:url" content="https://nexxadbc.com/" />
    <meta property="og:image" content="https://nexxadbc.com/og-image.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexxaDBC | Digital Business Cards for Professionals & Teams" />
    <meta
      name="twitter:description"
      content="Create your NexxaDBC digital business card in minutes. Share it instantly by QR code, capture leads, and manage your whole team's cards, no app download or printing needed."
    />
    <meta name="twitter:image" content="https://nexxadbc.com/og-image.webp" />
    <script>
      // The built manifest.webmanifest is one static file shared by every
      // route, with start_url "/", so installing from a customer's own
      // card page (/holder/:orderCode) still launched the installed app at
      // the Landing page, not their card. On that route, swap the
      // <link rel="manifest"> to a blob URL manifest whose start_url is
      // this exact page, before Chrome ever evaluates installability. The
      // manifest link is appended by the build tooling after this script
      // runs, so a MutationObserver (not a direct query) catches it the
      // moment it lands, however that timing shakes out across builds.
      //
      // /admin needs the same early-swap treatment for a different reason:
      // it's a genuinely separate installable app ("NexxaDBC Admin", its
      // own icon/name) so admins can install it distinct from the
      // customer-facing app and get lock-screen push without keeping a
      // browser tab open. A React useEffect doing this swap after mount is
      // too late -- Chrome evaluates installability against whatever
      // manifest link is present shortly after the initial load, before
      // React ever runs, so the swap has to happen here, synchronously off
      // location.pathname, exactly like the /holder swap below.
      (function () {
        if (location.pathname === "/admin") {
          function swapAdmin(link) {
            link.setAttribute("href", "/admin-manifest.json");
          }
          var existingAdmin = document.querySelector('link[rel="manifest"]');
          if (existingAdmin) {
            swapAdmin(existingAdmin);
            return;
          }
          var adminObserver = new MutationObserver(function () {
            var link = document.querySelector('link[rel="manifest"]');
            if (link) {
              swapAdmin(link);
              adminObserver.disconnect();
            }
          });
          adminObserver.observe(document.documentElement, { childList: true, subtree: true });
          return;
        }
        var match = location.pathname.match(/^\/holder\/[\w-]+$/);
        if (!match) return;
        // Fully-qualified absolute URLs, not root-relative paths: a
        // manifest served from a blob: URL doesn't resolve "/x" against
        // the page's own origin the way a normally-hosted manifest does,
        // and Chrome silently drops any field it can't resolve.
        var origin = location.origin;
        function swap(link) {
          var manifest = {
            name: "NexxaDBC",
            short_name: "NexxaDBC",
            description: "Your digital business card, always in your pocket.",
            theme_color: "#ff4e00",
            background_color: "#ffffff",
            display: "standalone",
            scope: origin + "/",
            // Preserves the query string (e.g. the provisioning QR's
            // ?claim=1 marker); dropping it here meant the very first
            // launch of an installed app could silently lose it, on any
            // platform/timing where the app's first real run happens
            // through the installed icon rather than the browser tab that
            // scanned the QR.
            start_url: origin + location.pathname + location.search,
            icons: [
              { src: origin + "/icon-192.png", sizes: "192x192", type: "image/png" },
              { src: origin + "/icon-512.png", sizes: "512x512", type: "image/png" },
              { src: origin + "/icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
            ]
          };
          var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
          link.setAttribute("href", URL.createObjectURL(blob));
        }
        var existing = document.querySelector('link[rel="manifest"]');
        if (existing) {
          swap(existing);
          return;
        }
        var observer = new MutationObserver(function () {
          var link = document.querySelector('link[rel="manifest"]');
          if (link) {
            swap(link);
            observer.disconnect();
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();

      // Capture beforeinstallprompt as early as possible, before any React
      // module even loads, since it can fire within the first moments of
      // page load and Chrome discards it if nothing calls preventDefault()
      // in time. The app reads window.__deferredInstallPrompt once it's
      // ready to act on it, however late that ends up being.
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
